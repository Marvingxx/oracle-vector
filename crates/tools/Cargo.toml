[package]
name = "oracle-vector-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Vector tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
oracle-vector-geom = { workspace = true }
oracle-vector-color = { workspace = true }
oracle-vector-doc = { workspace = true }
oracle-vector-pathops = { workspace = true }
oracle-vector-effects = { workspace = true }
oracle-vector-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
oracle-vector-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
