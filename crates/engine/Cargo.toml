[package]
name = "oracle-vector-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Vector engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts oracle-vector-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`oracle_vector_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["oracle-vector-text/bundled-fonts"]

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
oracle-vector-geom = { workspace = true }
oracle-vector-color = { workspace = true }
oracle-vector-doc = { workspace = true }
oracle-vector-tools = { workspace = true }
oracle-vector-text = { workspace = true }
oracle-vector-render = { workspace = true }
oracle-vector-pathops = { workspace = true }
oracle-vector-brush = { workspace = true }
oracle-vector-trace = { workspace = true }
oracle-vector-svg = { workspace = true }
oracle-vector-format = { workspace = true }
oracle-vector-pdf = { workspace = true }
oracle-vector-cad = { workspace = true }
oracle-vector-eps = { workspace = true }
oracle-vector-metafile = { workspace = true }
oracle-vector-plugins = { workspace = true }
oracle-vector-affinity = { workspace = true }
oracle-vector-scriptcheck = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Logo grids and bento layouts shared by the Oracle apps (brandgrids.rs); pure geometry, wasm too.
oracle-brandtools = { path = "../../../oracle-library/brandtools", default-features = false }

# Documents of the other Oracle apps, drawn by them (oracle_files.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oracle-suite-link = { path = "../../../oracle-library/link" }

[dev-dependencies]
oracle-vector-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
oracle-vector-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
oracle-vector-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
