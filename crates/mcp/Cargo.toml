[package]
name = "oracle-vector-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Vector MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts oracle-vector-text bundles for documents, through the engine's `bundled-fonts`, as
# oracle-vector-ui-egui's. Off, for an embedder that supplies every document font at run time.
bundled-fonts = ["oracle-vector-engine/bundled-fonts"]

[dependencies]
oracle-vector-engine = { workspace = true }
oracle-vector-render = { workspace = true }
oracle-vector-svg = { workspace = true }
oracle-vector-format = { workspace = true }
oracle-vector-tools = { workspace = true }
oracle-vector-geom = { workspace = true }
oracle-vector-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[dev-dependencies]
oracle-vector-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
