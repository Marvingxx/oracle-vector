[package]
name = "oracle-vector-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Vector egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[features]
default = ["bundled-fonts", "interface-fonts"]
# The fonts oracle-vector-text bundles for documents, through the engine's `bundled-fonts`. Off, for
# an embedder that supplies every document font at run time (`oracle_vector_text::FontDb::add_font`);
# the interface's own faces are `interface-fonts`.
bundled-fonts = ["oracle-vector-engine/bundled-fonts"]
# The interface's own faces (theme.rs: Inter, Source Sans 3, JetBrains Mono, about 2 MB). Off, the
# panels and dialogs draw in egui's built-in fonts, which lack some symbols they show (→ ▾ ● ✓);
# `theme::install_fonts` binds their families either way.
interface-fonts = []

[dependencies]
craft-ui = { workspace = true }
oracle-vector-geom = { workspace = true }
oracle-vector-color = { workspace = true }
oracle-vector-doc = { workspace = true }
oracle-vector-brush = { workspace = true }
oracle-vector-render = { workspace = true }
oracle-vector-text = { workspace = true }
oracle-vector-tools = { workspace = true }
oracle-vector-engine = { workspace = true }
oracle-vector-svg = { workspace = true }
oracle-vector-effects = { workspace = true }
oracle-vector-three-d = { workspace = true }
oracle-vector-plugins = { workspace = true }
oracle-vector-pdf = { workspace = true }
oracle-vector-cad = { workspace = true }
oracle-vector-eps = { workspace = true }
oracle-vector-format = { workspace = true }
egui = { workspace = true, features = ["bytemuck"] }
# With egui's `bytemuck`: copies rendered rasters into egui images whole (`canvas::color_image`).
bytemuck = "1"
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The Oracle Library window: the user's asset folder, searchable, dragged onto the artboard.
oracle-library-ui = { path = "../../../oracle-library/ui" }
# Edit Original of another Oracle app's document opens it in that app (panels/links.rs).
oracle-suite-link = { path = "../../../oracle-library/link" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `now_ms` (src/lib.rs) reads the page's `performance.now()` with this crate in the web build. It is
# MIT OR Apache-2.0 and already in the build through eframe.
web-time = "1"

# The current user's id (`geteuid`): Preview in Browser uses its temporary folder only when that
# user owns it (src/dialogs/save_for_web.rs). Already in Cargo.lock (tempfile), so this adds no
# new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
oracle-vector-testkit = { workspace = true }
# A variable font built in code (no font file is committed).
oracle-vector-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
