[package]
name = "oracle-vector-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Vector Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
oracle-vector-geom = { workspace = true }
oracle-vector-color = { workspace = true }
oracle-vector-doc = { workspace = true }
oracle-vector-effects = { workspace = true }
oracle-vector-brush = { workspace = true }
oracle-vector-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
oracle-vector-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
oracle-vector-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
oracle-vector-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
# Images read through `CCITTFaxDecode`.
hayro-ccitt = { workspace = true }
# Live effects' params, as the art styles that name them give them.
serde_json = { workspace = true }

[dev-dependencies]
oracle-vector-testkit = { workspace = true }
# Tests: a Group 4 encoder and the T.4 run codes, to write CCITT test images.
fax = "0.2"
